<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalends — interaction direction</title>
<style>
:root{--paper:#f4f0e7;--ink:#23332c;--muted:#58665e;--line:#d7d9cb;--green:#264f40;--green-light:#e4eadc;--rust:#9b492c;--gold:#d4b56c;--white:#fffdf7;--dark:#172c25;--shadow:0 22px 65px #1f312718;--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}button,input,a{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ad5c2a;outline-offset:4px}button{border:0}a{color:var(--green);text-underline-offset:4px}.fixture-banner{padding:9px 24px;background:#e8dfcb;color:#4e493c;text-align:center;font-size:12px;letter-spacing:.02em}header{max-width:1440px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 48px;border-bottom:1px solid var(--line)}.brand{font:26px var(--serif);letter-spacing:.13em;background:none;color:var(--ink);padding:4px 0}.nav{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.nav button{background:none;color:var(--muted);padding:8px 0;border-bottom:2px solid transparent;font-size:14px}.nav button[aria-current=page]{color:var(--ink);border-color:var(--ink)}main{max-width:1440px;margin:auto;padding:42px 48px 60px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.17em;font-weight:650;color:var(--muted);margin:0 0 14px}.hero{display:grid;grid-template-columns:1.04fr 1fr;gap:56px;align-items:center;padding:24px 0 42px}h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;margin:0}h1{font-size:clamp(42px,5.5vw,76px);letter-spacing:-.045em}h2{font-size:38px;letter-spacing:-.025em}h3{font-size:26px}.lede{font-size:18px;max-width:51ch;margin:24px 0;color:var(--muted)}.primary,.secondary,.text-button{padding:13px 21px;border-radius:5px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:9px;line-height:1.4}.primary{background:var(--green);color:white}.secondary{background:var(--white);border:1px solid var(--line);color:var(--ink)}.text-button{background:none;color:var(--green);padding-left:0;padding-right:0}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.fine{font-size:12px;color:var(--muted)}.hero-caption{position:absolute;bottom:22px;left:25px;right:25px;color:#f7ecd2;z-index:3}.hero-caption strong{font:29px var(--serif);display:block}.hero-caption small{font-size:12px;display:block;margin-top:6px}.stage-art{position:relative;min-height:430px;border-radius:10px;overflow:hidden;background:linear-gradient(165deg,#bcc9bb 0%,#d0c8a6 48%,#b3ae89 49%,#687c65 100%);isolation:isolate}.stage-art:after{content:'';position:absolute;inset:55% 0 0;background:linear-gradient(transparent,#26382bdc);pointer-events:none;z-index:2}.sun{position:absolute;width:105px;height:105px;border-radius:50%;background:#f6e7b3;right:55px;top:40px}.block{position:absolute;bottom:130px;background:#dbc3a0;box-shadow:inset -24px 0 #c0a486;border-top:16px solid #985f45}.block.one{width:45%;height:155px;left:-5%;transform:skewY(10deg)}.block.two{width:47%;height:210px;right:-4%;transform:skewY(-10deg)}.block.three{width:25%;height:115px;left:37%;bottom:151px}.block:before{content:'';position:absolute;width:26px;height:75px;bottom:0;left:35%;border-radius:30px 30px 0 0;background:#4f5546}.street{position:absolute;width:65%;height:190px;left:18%;bottom:0;background:#bcb293;clip-path:polygon(38% 0,66% 0,100% 100%,0 100%)}.scene-note{position:absolute;left:15px;top:15px;background:#f5efdfde;color:#3c493c;font-size:10px;padding:6px 10px;z-index:5;border-radius:3px}.worlds-row{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-top:28px;border-top:1px solid var(--line)}.world-card{border:1px solid var(--line);border-radius:8px;padding:26px;background:var(--white)}.world-card p{max-width:56ch;color:var(--muted)}.small-label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}.split-title{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.meta{display:flex;gap:20px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px}.experience-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:24px;align-items:start}.scene-shell{position:relative}.scene-shell .stage-art{min-height:555px}.scene-overlay{position:absolute;bottom:24px;left:24px;right:24px;z-index:4;background:#f8f4e8ed;border:1px solid #fff9;border-radius:7px;padding:20px 22px;box-shadow:var(--shadow)}.scene-overlay .eyebrow{margin-bottom:7px}.scene-overlay p{margin:8px 0;font-size:14px}.figure{position:absolute;z-index:1;bottom:155px;width:24px;height:66px;background:#7c4b3c;border-radius:12px 12px 3px 3px}.figure:before{content:'';position:absolute;width:20px;height:20px;top:-14px;left:2px;border-radius:50%;background:#b48f6a}.figure.player{left:49%;background:#344d42}.figure.sabina{left:26%;bottom:161px}.side-panel{background:var(--white);border:1px solid var(--line);padding:27px;border-radius:8px;box-shadow:var(--shadow)}.speaker{display:flex;align-items:center;gap:13px;margin-bottom:22px}.initial{border-radius:50%;background:#e9dfcc;width:42px;height:42px;display:grid;place-items:center;font:22px var(--serif)}.speaker strong{font-weight:600;display:block}.speaker small{color:var(--muted);font-size:12px}.dialogue{font-family:var(--serif);font-size:24px;line-height:1.45;margin:16px 0 24px}.choices{display:flex;flex-direction:column;gap:10px}.choices button{background:#f0f1e7;text-align:left;min-height:48px;padding:13px 15px;border:1px solid transparent;border-radius:5px;color:var(--ink)}.choices button:hover{background:#e3e8d9;border-color:#bbc9b5}.choices small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.evidence-note{padding:13px 15px;border-left:3px solid var(--green);background:#eef1e8;font-size:14px;margin:17px 0}.bottom-tools{display:flex;justify-content:space-between;gap:15px;margin-top:18px;flex-wrap:wrap}.bottom-tools button{background:none;padding:6px 0;color:var(--green);font-size:13px;text-decoration:underline;text-underline-offset:4px}.secondary-link{color:var(--green);background:none;font-size:13px;padding:12px 0}.obs-layout{display:grid;grid-template-columns:minmax(280px,1.7fr) minmax(300px,1fr);gap:26px}.capacity-panel{background:var(--dark);color:var(--paper);border-radius:9px;padding:30px;margin-bottom:22px}.capacity-panel .eyebrow{color:#bdcbbf}.capacity-count{font:62px var(--serif);line-height:1;margin:10px 0 15px}.capacity-count span{font:15px var(--sans);color:#d2ddce}.capacity-slots{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:20px 0 12px}.capacity-slot{height:27px;background:#819381;border-radius:2px}.capacity-slot.off{background:transparent;border:1px dashed #819381}.capacity-panel p{font-size:14px;color:#d3dece}.team-row{display:grid;grid-template-columns:1fr auto;gap:15px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}.team-row h3{font-size:26px}.team-row p{margin:4px 0;color:var(--muted);font-size:13px}.stepper{display:flex;gap:6px;align-items:center}.stepper button{height:42px;width:38px;border:1px solid var(--line);border-radius:4px;background:var(--white);color:var(--ink)}.stepper input{width:50px;height:42px;text-align:center;border:1px solid var(--line);border-radius:4px;background:var(--white);color:var(--ink);appearance:textfield;-moz-appearance:textfield}.stepper input::-webkit-inner-spin-button{appearance:none}.total-line{display:flex;justify-content:space-between;padding:20px 0;font-weight:600}.warning{font-size:14px;padding:14px;background:#f8e8da;color:#793d25;border-left:3px solid var(--rust);margin:15px 0}.promise{display:flex;align-items:start;gap:10px;font-size:14px;margin:18px 0}.promise input{width:18px;height:18px;flex:0 0 18px;margin-top:4px;accent-color:var(--green)}.ledger{width:100%;border-collapse:collapse;font-size:14px;margin-top:18px}.ledger th,.ledger td{text-align:right;padding:12px 7px;border-bottom:1px solid var(--line)}.ledger th:first-child,.ledger td:first-child{text-align:left}.ledger th{font-weight:500;color:var(--muted);font-size:12px}.flow-label{color:var(--muted);font-size:13px;margin:12px 0 20px}.quote-small{font:21px/1.5 var(--serif)}.chapter{padding:24px 0;border-bottom:1px solid var(--line);max-width:780px}.chapter p{max-width:64ch;color:var(--muted)}.research{max-width:900px}.research p{max-width:72ch}.research-box{border-left:3px solid var(--green);padding:20px 26px;background:var(--white);margin:25px 0}.text-muted{color:var(--muted)}.history-callout{background:#e7e9dc;padding:18px;border-radius:5px;margin-top:22px;font-size:14px}.history-callout a{font-size:13px}.pill{display:inline-block;font-size:11px;padding:5px 9px;border-radius:20px;background:var(--green-light);color:var(--green)}footer{max-width:1440px;margin:auto;border-top:1px solid var(--line);padding:22px 48px 35px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--white);color:var(--ink);width:min(560px,calc(100% - 30px));max-height:90dvh;box-shadow:0 30px 100px #0004}dialog::backdrop{background:#132a2399;backdrop-filter:blur(3px)}.modal-content{padding:30px}.modal-content h2{font-size:31px}.modal-content p{max-width:55ch}.modal-top{display:flex;justify-content:space-between;align-items:start;gap:15px}.close{background:#ecefe5;border-radius:50%;width:34px;height:34px;color:var(--ink);flex:0 0 34px}.review-facts{margin:20px 0;border-top:1px solid var(--line)}.review-facts div{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}.review-facts dt{color:var(--muted)}.review-facts dd{margin:0;text-align:right}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}summary{cursor:pointer;color:var(--green)}details{margin:18px 0}details p{font-size:14px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff9e7;max-width:calc(100% - 30px);border-radius:6px;padding:12px 20px;z-index:30;box-shadow:var(--shadow);font-size:14px}.animate{animation:arrive .24s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:950px){header{padding:20px 25px}main{padding:28px 25px 45px}.hero{gap:26px}.experience-layout,.obs-layout{grid-template-columns:1fr}.scene-shell .stage-art{min-height:340px}.side-panel{box-shadow:none}.scene-shell .stage-art .figure{bottom:100px}.scene-shell .stage-art .figure.sabina{bottom:120px}.hero .stage-art{min-height:390px}footer{padding:22px 25px}}@media(max-width:650px){.fixture-banner{font-size:10px;padding:8px 15px}header{padding:16px;align-items:flex-start;gap:12px;flex-direction:column}.brand{font-size:23px}.nav{gap:20px}.nav button{font-size:13px}main{padding:26px 16px 36px}.hero{display:flex;flex-direction:column;align-items:stretch;padding-top:0;gap:24px}.hero .stage-art{min-height:280px}.hero h1{font-size:49px}.hero .lede{font-size:16px}.worlds-row{grid-template-columns:1fr}.world-card{padding:22px}.split-title{align-items:start;flex-direction:column}.split-title h1{font-size:42px}.meta{font-size:12px;gap:12px}.side-panel{padding:22px}.scene-overlay{left:15px;right:15px;bottom:16px;padding:17px}.dialogue{font-size:23px}.capacity-panel{padding:23px}.capacity-count{font-size:52px}.capacity-slots{gap:4px}.modal-content{padding:23px}.ledger{font-size:13px}.ledger th{font-size:11px}.scene-shell .stage-art{min-height:330px}.team-row{gap:8px}.actions .primary,.actions .secondary{flex:1}.research h1{font-size:43px}footer{padding:20px 16px}.hero-caption strong{font-size:25px}}
</style></head><body>
<div class="fixture-banner">INTERACTION REFERENCE · Fictional frontend fixtures, not the Kalends build. No AI, backend connection or saved-life changes.</div>
<header><button class="brand" data-view="home" aria-label="Kalends home">KALENDS</button><nav class="nav" aria-label="Main"><button data-view="home">Worlds</button><button data-view="story">Your story</button><button data-view="research">Research</button><button id="reset-reference">Reset reference</button></nav></header>
<main id="app" tabindex="-1"></main><footer><span>A place to explore. A history that stays.</span><span>Design reference only · Reload resets this fixture.</span></footer>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-content" id="modal-content"></div></dialog><div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
<script>
'use strict';
const state={view:'home',pompeii:{heard:false,order:false,settled:false,coins:6,minute:0},obs:{report:false,alloc:[0,0,0],committed:null,promise:false,committedPromise:false,settled:false,delivered:[0,0,0]},story:[]};
const app=document.getElementById('app'),modal=document.getElementById('modal');let modalTrigger=null,toastTimer;
function announce(s){document.getElementById('announcer').textContent=s;}
function toast(s){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),4000);announce(s);}
function art(overlay=''){return `<div class="stage-art" aria-label="Schematic architectural placeholder, not a Kalends screenshot"><span class="scene-note">SCENE PLACEHOLDER · Keep the real 3D world in production</span><div class="sun"></div><div class="block one"></div><div class="block three"></div><div class="block two"></div><div class="street"></div>${overlay}</div>`}
function view(name){state.view=name;render();app.focus({preventScroll:true});window.scrollTo(0,0);}
function render(){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);document.querySelectorAll('.nav [data-view]').forEach(e=>{if(e.dataset.view===state.view)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current');});app.innerHTML=({home:home,pompeii:pompeii,observatory:observatory,story:story,research:research}[state.view]||home)();app.classList.remove('animate');void app.offsetWidth;app.classList.add('animate');}
function home(){return `<section class="hero"><div><p class="eyebrow">Two places to take part in</p><h1>Spend a morning<br>in Pompeii.</h1><p class="lede">A flour cart has arrived. Two buyers claim it. Hear their accounts, decide whether to help, and see what your choice changes.</p><div class="actions"><button class="primary" data-view="pompeii">Enter Pompeii <span aria-hidden="true">↗</span></button><button class="secondary" data-view="observatory">Try the Observatory</button></div><p class="fine">Prototype experiences. No account needed in this reference.</p></div>${art('<div class="hero-caption"><span class="small-label" style="color:#f1dfb8">The first morning</span><strong>Pompeii, 79 CE</strong><small>A fictional life in a historically informed setting.</small></div>')}</section><section class="worlds-row" aria-label="Choose an experience"><article class="world-card"><p class="eyebrow">Explore a place</p><h3>A morning in Pompeii</h3><p>A cart has arrived. Two buyers claim its flour. Meet Sabina, hear the accounts, and decide whether to get involved.</p><button class="text-button" data-view="pompeii">Begin with Sabina <span aria-hidden="true">→</span></button></article><article class="world-card"><p class="eyebrow">Work through a decision</p><h3>Three teams. One instrument.</h3><p>Learn what capacity is available, make an allocation, and see what each team receives. A request is not the same as a promise.</p><button class="text-button" data-view="observatory">Meet the teams <span aria-hidden="true">→</span></button></article></section>`;}
function pompeii(){const p=state.pompeii;let speech,choices,goal;
if(p.settled){speech='The carrying charge is paid. Four sacks reached Sabina, and two reached Felix.';goal='See what your choice changed.';choices='<button data-action="outcome">See the delivery</button><button data-view="story">Open your story</button>';}
else if(p.order){speech='I paid four coins for two sacks. The household has an order too. You should hear their side before deciding.';goal='You have one account. Decide what to do next.';choices='<button data-action="evidence">Read Sabina’s order</button><button data-action="review-market">Pay for the market delivery <small>3 coins · 20 minutes · Review the terms first</small></button><button data-action="not-yet">Not yet. I’ll hear the other account.</button>';}
else if(p.heard){speech='I paid Marcus, but the flour is still on the cart. Here is my order. Look at it before you decide whom to help.';goal='Look at Sabina’s order.';choices='<button data-action="read-order">May I see your order?</button><button data-action="not-yet">I’ll come back.</button>';}
else{speech='I paid for two sacks. Now the household is asking for the cart. Can you find out what happened?';goal='Ask Sabina about the cart.';choices='<button data-action="ask-cart">What happened to your order?</button><button data-action="history">What kind of place is this?</button><button data-action="not-yet">I’m just looking around.</button>';}
return `<div class="split-title"><div><p class="eyebrow">Your first morning</p><h1>Aelia’s Pompeii</h1></div><div class="meta"><span><span class="status-dot"></span>Reading pauses time</span><span id="coin-count">${p.coins} coins</span><button class="secondary" data-action="help">Help</button></div></div><div class="experience-layout"><div><div class="scene-shell">${art('<div class="figure player"></div><div class="figure sabina"></div>')}<div class="scene-overlay"><p class="eyebrow">Next</p><h3>${goal}</h3><p>The reference demonstrates the interface, not movement or NPC simulation.</p></div></div><div class="bottom-tools"><button data-action="history">About this place</button><button data-view="story">Your story</button><button data-view="home">Leave the scene</button></div></div><section class="side-panel" aria-label="Conversation"><div class="speaker"><div class="initial" aria-hidden="true">S</div><div><strong>${p.settled?'Delivery summary':'Sabina'}</strong><small>${p.settled?'Sample receipt · no real life changed':'Food-counter owner · fictional character'}</small></div></div><p class="dialogue">${speech}</p>${p.order&&!p.settled?'<div class="evidence-note">You have Sabina’s order.<br><button class="secondary-link" data-action="evidence">See what it says</button></div>':''}<div class="choices">${choices}</div><p class="fine">Production: dialogue comes from the character’s permitted experience. This reference uses fixed sample lines.</p></section></div>`;}
function observatory(){const o=state.obs;const total=o.alloc.reduce((a,b)=>a+b,0);const names=['Amir','Mira','Lin'];return `<div class="split-title"><div><p class="eyebrow">Shared Observatory · Round one</p><h1>Who gets the instrument?</h1></div><div class="meta"><span><span class="status-dot"></span>${o.settled?'Round complete':'No time passes while you read'}</span><button class="secondary" data-action="help">Help</button></div></div><div class="obs-layout"><section><div class="capacity-panel"><p class="eyebrow">${o.settled?'Round result · Day 1, 23:59':o.report?'Mira’s report · Today, 00:00':'Rated capacity · Actual condition unknown'}</p><div class="capacity-count">${o.settled||o.report?'8':'12'} <span>${o.settled?'usable units in this round':o.report?'units reported available':'units at full capacity'}</span></div><div class="capacity-slots" aria-hidden="true">${Array.from({length:12},(_,i)=>`<span class="capacity-slot ${(o.settled||o.report)&&i>=8?'off':''}"></span>`).join('')}</div><p>${o.settled?'The round has run. The table below shows what each team actually received.':o.report?'Mira reported reduced capacity. If that condition persists, eight units can be delivered.':'Mira has information about the instrument. Ask for her report before deciding what to allocate.'}</p>${!o.report&&!o.settled?'<button class="secondary" data-action="report">Ask Mira for her report</button>':o.report?'<button class="secondary" data-action="report-detail">Read the earlier report</button>':''}</div>${o.settled?resultTable():`<p class="flow-label">Read the requests → choose an allocation → run the round</p>${names.map((name,i)=>`<div class="team-row"><div><h3>${name}</h3><p>${['Survey','Instrument systems','Follow-up'][i]} · Project needs 4 units in one round</p></div><div class="stepper"><button data-step="${i}:-1" aria-label="Reduce ${name}'s allocation">−</button><input id="amount-${i}" aria-label="Allocation for ${name}" type="number" min="0" max="12" step="1" value="${o.alloc[i]}"><button data-step="${i}:1" aria-label="Increase ${name}'s allocation">+</button></div></div>`).join('')}<div class="total-line"><span>Total planned</span><span id="total">${total} units</span></div><div id="allocation-warning"></div><button class="primary" data-action="review-allocation">Review allocation</button>`}</section><aside class="side-panel"><p class="eyebrow">Your role</p><h3>Coordinate, then see what happens.</h3><p class="text-muted">Each team needs four units to complete its project. Decide how to divide capacity; this exercise serves Amir first, then Mira, then Lin.</p><details><summary>Why does the order matter?</summary><p>If capacity runs out, a later team receives less than you allocated. This ordering is a fictional exercise rule, not an astronomy standard.</p></details><hr style="border:0;border-top:1px solid var(--line)"><p class="eyebrow" style="margin-top:22px">A promise is separate</p>${o.settled?`<p>${o.committedPromise?(o.delivered[2]>=4?'Your promise to Lin was kept.':'You promised Lin four units. That promise was not met.'):'You made no promise in this reference round.'}</p>`:`<label class="promise"><input id="promise-checkbox" type="checkbox" ${o.promise?'checked':''}> Include a promise of four units to Lin in the review.</label><p class="fine">Selecting this box is a draft. It creates no promise until you confirm the allocation review.</p>`}<div class="history-callout"><strong>${o.settled?'Round settled.':o.committed?'Allocation saved.':'Nothing has been delivered yet.'}</strong><p>${o.settled?'The delivered quantities are now part of this reference history.':o.committed?'You can change it before running the round.':'The result appears after you explicitly run the round.'}</p></div>${o.committed&&!o.settled?'<button class="primary" data-action="finish-round" style="margin-top:22px;width:100%">Review and run the round</button>':''}${o.settled?'<button class="primary" data-view="story" style="margin-top:22px;width:100%">See your story</button>':''}</aside></div>`;}
function resultTable(){const o=state.obs;return `<section aria-label="Actual result"><p class="eyebrow">Sample round result</p><h2>Eight units were available.</h2><p class="text-muted">Allocation and delivery are shown separately. These values come from the reference’s fixed allocation rule, not the real simulator.</p><table class="ledger"><thead><tr><th>Team</th><th>Allocated</th><th>Delivered</th><th>Project</th></tr></thead><tbody>${['Amir','Mira','Lin'].map((n,i)=>`<tr><td>${n}</td><td>${o.committed[i]}</td><td>${o.delivered[i]}</td><td>${o.delivered[i]>=4?'Complete':'Not complete'}</td></tr>`).join('')}</tbody></table><details><summary>Why did this happen?</summary><p>Start with eight units, serve Amir’s allocation, then Mira’s, then Lin’s. Each team receives the smaller of its allocation and the remaining capacity.</p></details></section>`;}
function story(){return `<section><p class="eyebrow">Your story · Reference session</p><h1>Your time here.</h1><p class="lede">The moments below come from actions you took in this interface reference. They are not imported Kalends history.</p>${state.story.length?state.story.map((s,i)=>`<article class="chapter"><p class="eyebrow">${String(i+1).padStart(2,'0')} · ${s.world}</p><h3>${s.title}</h3><p>${s.body}</p></article>`).join(''):'<article class="chapter"><h3>Your story has not started yet.</h3><p>Meet Sabina or make an Observatory allocation. We will keep the sample consequences here while this page remains open.</p></article>'}<div class="actions" style="margin-top:28px"><button class="primary" data-view="pompeii">Return to Pompeii</button><button class="secondary" data-view="observatory">Open Observatory</button></div></section>`;}
function research(){return `<section class="research"><p class="eyebrow">The same history, a different question</p><h1>What can the evidence<br>actually establish?</h1><p class="lede">The public experience should feel coherent. The research view should make that coherence testable.</p><div class="research-box"><span class="pill">Latest supplied result · no advantage shown</span><h3 style="margin-top:17px">The candidate tied V3.</h3><p>The first-session handoff reports that both passed 140 of 160 held-out primary cases, with 160 paired ties. That does not establish general equivalence, and the earlier authored-task gain is not a generalization result.</p></div><h3>Three separate types of evidence</h3><p><strong>World receipts:</strong> what actually happened.<br><strong>Accessible memories:</strong> what a particular character could know.<br><strong>Executed alternatives:</strong> what changed after a specified intervention.</p><p class="text-muted">A readable story is not proof of a smarter agent. A passing browser test is not proof that a person enjoyed the experience.</p><p class="fine">Source: supplied KALENDS_FIRST_SESSION_REPAIR_HANDOFF.md, research section. This reference does not run an experiment or expose real operator information.</p><button class="text-button" data-view="home">Back to the worlds →</button></section>`;}
function addStory(world,title,body){state.story.push({world,title,body});}
function openModal(title,body,actions=''){modalTrigger=document.activeElement;document.getElementById('modal-content').innerHTML=`<div class="modal-top"><h2 id="modal-title" tabindex="-1">${title}</h2><button class="close" data-action="close-modal" aria-label="Close dialog">×</button></div>${body}<div class="actions" style="margin-top:22px">${actions||'<button class="secondary" data-action="close-modal">Back</button>'}</div>`;modal.showModal();document.getElementById('modal-title').focus();}
function closeModal(){modal.close();if(modalTrigger?.isConnected)modalTrigger.focus();}
modal.addEventListener('close',()=>{if(modalTrigger?.isConnected)modalTrigger.focus();});
function checkAlloc(){const o=state.obs,total=o.alloc.reduce((a,b)=>a+b,0);document.getElementById('total')&&(document.getElementById('total').textContent=total+' units');const e=document.getElementById('allocation-warning');if(e)e.innerHTML=total>12?'<div class="warning">This exceeds the instrument’s rated capacity of twelve. Reduce the total before saving.</div>':o.report&&total>8?`<div class="warning">This is ${total-8} more than Mira’s report supports. Later teams may receive less.</div>`:'';}
function act(a){const p=state.pompeii,o=state.obs;
if(a==='close-modal')return closeModal();
if(a==='ask-cart'){p.heard=true;render();announce('Sabina explains her account.');}
if(a==='read-order'){p.order=true;addStory('Pompeii','You heard one side.','Sabina showed you an order for two sacks with four coins advanced. It is her account, not the whole dispute.');render();announce('Sabina’s order is available in your evidence.');}
if(a==='evidence')openModal('Sabina’s order','<p class="eyebrow" style="margin-top:20px">A fictional document · Received from Sabina</p><p class="quote-small">Two sacks of flour.<br>Four coins advanced to Marcus.</p><p>This records Sabina’s account. It does not settle the household’s claim.</p>');
if(a==='review-market')openModal('Pay for the market delivery?',`<p>This arrangement sends four sacks to Sabina and two to Felix, instead of giving the household priority.</p><dl class="review-facts"><div><dt>You pay</dt><dd>3 coins · You have ${p.coins}</dd></div><div><dt>Time passes</dt><dd>20 minutes</dd></div><div><dt>Household payment</dt><dd>Refunded under this route</dd></div></dl><p class="fine">This commits a fixture transaction in the reference only. The real build must validate the current offer and show its actual receipt.</p>`,'<button class="secondary" data-action="close-modal">Keep looking</button><button class="primary" data-action="confirm-market">Pay 3 coins</button>');
if(a==='confirm-market'){if(!p.settled&&p.coins>=3){p.coins-=3;p.minute+=20;p.settled=true;addStory('Pompeii','You paid for the market delivery.','Three coins paid the carrying charge. The sample receipt sends four sacks to Sabina and two to Felix.');}closeModal();render();announce('Market delivery completed in the reference.');}
if(a==='outcome')openModal('The delivery arrived.','<p>You paid three coins. Sabina received four sacks, and Felix received two.</p><p class="fine">Only show a person’s response or relationship change after the participant legitimately observes it. Do not expose an unseen trust score.</p>');
if(a==='history')openModal('A counter on the street','<p class="eyebrow" style="margin-top:20px">Historical context · Optional</p><p class="quote-small">The counter at the Thermopolium of Vetutius Placidus had large jars built into it.</p><p>That surviving feature helps explain how the space was used. Sabina and this flour dispute are invented for the experience.</p><details><summary>Evidence and reconstruction</summary><p>The existing project source review supports this limited claim. The schematic picture in this reference is not archaeological evidence or a reconstruction of that building.</p><a href="https://pompeiisites.org/en/pompeii-map/analysis/along-the-streets-of-pompeii/" target="_blank" rel="noopener noreferrer">Read the Archaeological Park’s account</a></details>');
if(a==='help')openModal('One thing at a time.',state.view==='observatory'?'<p>First, ask Mira about the instrument. Then choose how much each team receives. Saving an allocation does not deliver it; running the round does.</p>':'<p>Ask Sabina about the cart, then look at her order. You can examine evidence before choosing an arrangement.</p><p class="fine">This reference demonstrates conversation and review flow only. The real build must guide movement through the existing 3D scene.</p>');
if(a==='not-yet')toast('No agreement made. The production scene should let you walk away immediately.');
if(a==='report'){o.report=true;addStory('Observatory','Mira shared her report.','At the start of the round, Mira reported eight usable units. You now have dated testimony rather than only the rated capacity.');render();checkAlloc();announce('Mira reports eight units available.');}
if(a==='report-detail')openModal('Mira’s report','<p class="eyebrow" style="margin-top:20px">Observed today at 00:00 · Shared by Mira</p><p class="quote-small">“The instrument is running at reduced capacity: eight units.”</p><p>This describes her observation at that time. It is not a guarantee about every later round.</p>');
if(a==='review-allocation'){const total=o.alloc.reduce((a,b)=>a+b,0);if(total>12)return toast('Reduce the total to twelve or less.');openModal('Save this allocation?',`<dl class="review-facts">${['Amir','Mira','Lin'].map((n,i)=>`<div><dt>${n}</dt><dd>${o.alloc[i]} units</dd></div>`).join('')}<div><dt>Total</dt><dd>${total} units</dd></div></dl>${o.report&&total>8?'<div class="warning">Mira reported eight units. If that remains true, later teams may receive less.</div>':''}<p>${o.promise?'This also promises Lin four units.':'No promise is included.'} Nothing is delivered until you run the round.</p>`,'<button class="secondary" data-action="close-modal">Change it</button><button class="primary" data-action="confirm-allocation">Save allocation</button>');}
if(a==='confirm-allocation'){o.committed=[...o.alloc];o.committedPromise=o.promise;closeModal();render();checkAlloc();toast('Allocation saved in the reference. Nothing delivered yet.');}
if(a==='finish-round')openModal('Run round one?',`<p>Advance from Day 1, 00:00 to Day 1, 23:59. The saved allocation is ${o.committed.join(" / ")} units for Amir, Mira and Lin. The instrument will serve them in that order.</p><p>${o.committedPromise?'Your promise to Lin will be checked against actual delivery.':'You made no promise in this round.'}</p><p class="fine">The reference uses a fixed eight-unit outcome. Production must use actual simulation receipts.</p>`,'<button class="secondary" data-action="close-modal">Not yet</button><button class="primary" data-action="confirm-finish">Run the round</button>');
if(a==='confirm-finish'&&!o.settled&&o.committed){let remaining=8;o.delivered=o.committed.map(n=>{const amount=Math.min(n,remaining);remaining-=amount;return amount;});o.settled=true;addStory('Observatory','Your allocation became a result.',`Amir received ${o.delivered[0]}, Mira ${o.delivered[1]}, and Lin ${o.delivered[2]} units.${o.committedPromise?' Your promise to Lin was '+(o.delivered[2]>=4?'kept.':'not met.'):''}`);closeModal();render();announce('Round settled. Read the actual deliveries.');}
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view)return view(b.dataset.view);if(b.dataset.action)return act(b.dataset.action);if(b.dataset.step){const[i,d]=b.dataset.step.split(':').map(Number);state.obs.alloc[i]=Math.max(0,Math.min(12,state.obs.alloc[i]+d));document.getElementById('amount-'+i).value=state.obs.alloc[i];checkAlloc();}if(b.id==='reset-reference'){openModal('Reset this reference?','<p>This clears only the sample actions on this page. No Kalends save is connected.</p>','<button class="secondary" data-action="close-modal">Cancel</button><button class="primary" id="confirm-reset">Reset reference</button>');}if(b.id==='confirm-reset'){state.pompeii={heard:false,order:false,settled:false,coins:6,minute:0};state.obs={report:false,alloc:[0,0,0],committed:null,promise:false,committedPromise:false,settled:false,delivered:[0,0,0]};state.story=[];closeModal();view('home');}});
document.addEventListener('input',e=>{if(e.target.id?.startsWith('amount-')){const i=Number(e.target.id.slice(-1));const n=Number(e.target.value);state.obs.alloc[i]=Number.isFinite(n)?Math.max(0,Math.min(12,Math.trunc(n))):0;e.target.value=state.obs.alloc[i];checkAlloc();}if(e.target.id==='promise-checkbox')state.obs.promise=e.target.checked;});
render();
</script></body></html>
